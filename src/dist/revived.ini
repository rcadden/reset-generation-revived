# Reset Generation Revived settings. Delete this file to restore defaults.
#
# render_height / render_width: the resolution the game engine draws at.
#   auto = pick the size that integer-scales to your monitor
#          (640x360 on any 16:9 screen: x2 at 720p, x3 at 1080p, x4 at 1440p).
#   Lower values make everything bigger; e.g. render_height=270 for 480x270.
render_height=auto
render_width=auto
#
# window_scale: windowed-mode size as a multiple of the render size (0 = auto).
window_scale=0
#
# fullscreen: start in borderless fullscreen (toggle any time with F11 or Alt+Enter).
fullscreen=false
#
# filter: nearest (crisp pixels) or smooth (bilinear, only used when the
#   window is not an exact multiple of the render size).
filter=nearest
